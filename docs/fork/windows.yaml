# liuran001/mihomo Alpha
# 真实可用性: prefer-udp / prefer-ipv6 / penalize-unstable 作用在 url-test、smart、load-balance
# prefer-asn、policy-priority、uselightgbm 只对 type: smart 生效
# DNS 连接池由内核默认开启，不要再写 disable-reuse

mixed-port: 7890
mode: rule
allow-lan: true
bind-address: "*"
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
external-ui: WebUI
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

profile:
  store-selected: true
  store-fake-ip: true

hosts:
  "realseek-pc.et.net": 10.126.0.10
  "realseek-server.et.net": 10.126.0.11

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 443]
      override-destination: false
    TLS:
      ports: [443]
    QUIC:
      ports: [443]
  skip-domain:
    - +.push.apple.com
    - +.et.net
  skip-dst-address:
    - 10.126.0.0/24
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24

geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24

# Windows 没有 eBPF。透明入站由 TUN 完成，协议栈用这个分支的默认高性能栈 mips，拥塞控制 bbr。
# 独立 EasyTier 只排除固定 overlay 和监听源端口；公共节点 IP 可能变化，不写死。
tun:
  enable: true
  stack: mips
  congestion-controller: bbr
  device: Meta
  auto-route: true
  strict-route: false
  auto-detect-interface: true
  dns-hijack:
    - any:53
  route-exclude-address:
    - 10.126.0.0/24
  exclude-src-port:
    - 11010
    - 11011
    - 11012
    - 11013
  mtu: 1500

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  ipv6-timeout: 300
  prefer-h3: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter-mode: blacklist
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  use-hosts: true
  use-system-hosts: false
  cache-algorithm: arc
  fake-ip-filter:
    - +.lan
    - +.local
    - +.et.net
    - 10.126.0.0/24
    - time.*.com
    - ntp.*.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - +.stun.*.*
    - stun.*.*
    - rule-set:cn_domain
    - rule-set:private_domain
    - rule-set:Lan_no_ip
    - rule-set:Direct_no_ip
    - rule-set:Domestic_no_ip
  default-nameserver:
    - tls://223.5.5.5
    - tls://120.53.53.53
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  fallback:
    - https://1.1.1.1/dns-query#代理模式
    - https://8.8.8.8/dns-query#代理模式
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  proxy-server-nameserver:
    - tls://223.5.5.5
    - tls://120.53.53.53
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "rule-set:proxy_domain":
      - https://1.1.1.1/dns-query#代理模式
      - https://8.8.8.8/dns-query#代理模式
    "rule-set:Domestic_no_ip,Direct_no_ip,Lan_no_ip,GoogleFCM_no_ip,cn_domain,private_domain":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query

proxy-providers:
  myclash:
    type: http
    url: "xxx"
    path: ./MyClashProvider.yaml
    interval: 21600
    exclude-filter: 自动|故障|流量|官网|套餐|机场|订阅|年|月|失联|频道|Traffic|Expire
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 900
      timeout: 5000
      lazy: true
      expected-status: 204

x-quality: &quality
  use:
    - myclash
  prefer-udp: true
  prefer-ipv6: true
  penalize-unstable: true
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  lazy: true

x-smart: &smart
  prefer-asn: true
  policy-priority: "IEPL:1.5"
  uselightgbm: true
  collectdata: false
  sample-rate: 1

